name: riskforge

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-riskuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}
      POSTGRES_DB: ${POSTGRES_DB:-riskregister}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-riskuser} -d ${POSTGRES_DB:-riskregister}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: riskforge-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-riskuser}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-riskregister}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://localhost:3000"]}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: riskforge-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata: